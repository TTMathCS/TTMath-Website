<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1398" height="718" rx="14" fill="#ffffff" stroke="#ddd"/>

  <!-- left: title + path flow -->
  <text x="48" y="72" font-size="38" font-weight="bold" fill="#111">AI Course Path</text>
  <text x="48" y="102" font-size="15" fill="#666">From AI basics to real products and international competition</text>

  <rect x="170" y="150" width="260" height="64" rx="12" fill="#fdf6e3" stroke="#e0c36a" stroke-width="2"/>
  <text x="300" y="178" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">AI-1</text>
  <text x="300" y="200" font-size="13" text-anchor="middle" fill="#555">Creator Foundations</text>
  <text x="300" y="232" font-size="12" text-anchor="middle" fill="#888">Foundation course, grades 6&#8211;10</text>
  <text x="300" y="249" font-size="12" text-anchor="middle" fill="#888">Starts no-code, then Python apps</text>

  <line x1="300" y1="264" x2="190" y2="332" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="264" x2="410" y2="332" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="303" font-size="13" text-anchor="middle" fill="#777">students branch by interest</text>

  <rect x="85" y="340" width="200" height="64" rx="12" fill="#e8f5e9" stroke="#7cb98a" stroke-width="2"/>
  <text x="185" y="368" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">AI-2 Product Studio</text>
  <text x="185" y="390" font-size="13" text-anchor="middle" fill="#555">Sep&#8211;Aug (3 terms)</text>
  <text x="185" y="424" font-size="12" text-anchor="middle" fill="#888">Builder track</text>
  <text x="185" y="441" font-size="12" text-anchor="middle" fill="#888">needs CS1 or AI-1B</text>

  <rect x="315" y="340" width="200" height="64" rx="12" fill="#e3f0fb" stroke="#7aa8d8" stroke-width="2"/>
  <text x="415" y="368" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">AI-3 Algorithms</text>
  <text x="415" y="390" font-size="13" text-anchor="middle" fill="#555">Sep&#8211;Aug (3 terms)</text>
  <text x="415" y="424" font-size="12" text-anchor="middle" fill="#888">Algorithms track</text>
  <text x="415" y="441" font-size="12" text-anchor="middle" fill="#888">needs CS2 + strong math (gr. 9+)</text>

  <!-- right: course descriptions -->
  <rect x="600" y="50" width="760" height="620" rx="14" fill="none" stroke="#dce8e2"/>

  <rect x="630" y="90" width="64" height="64" rx="14" fill="#fdf1d7"/>
  <circle cx="662" cy="117" r="12" fill="none" stroke="#c99b2e" stroke-width="2.5"/>
  <line x1="656" y1="133" x2="668" y2="133" stroke="#c99b2e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="658" y1="138" x2="666" y2="138" stroke="#c99b2e" stroke-width="2.5" stroke-linecap="round"/>
  <text x="715" y="118" font-size="22" font-weight="bold" fill="#111">AI-1: Creator Foundations <tspan font-size="16" font-weight="normal" fill="#444">(AI Basics &amp; Projects)</tspan></text>
  <text x="715" y="150" font-size="15" fill="#333">Foundation course for grades 6-10. Fall covers how AI works, prompting,</text>
  <text x="715" y="176" font-size="15" fill="#333">responsible use, and no-code model training; Spring/Winter builds</text>
  <text x="715" y="202" font-size="15" fill="#333">chatbots, vision and speech apps in Python; Summer Lab delivers a</text>
  <text x="715" y="228" font-size="15" fill="#333">personal portfolio project - every class ends with something to show.</text>

  <line x1="630" y1="258" x2="1330" y2="258" stroke="#eee"/>

  <rect x="630" y="295" width="64" height="64" rx="14" fill="#dff0e2"/>
  <text x="662" y="335" font-size="22" font-weight="bold" text-anchor="middle" fill="#3e8e55" font-family="Menlo, Consolas, monospace">&lt;/&gt;</text>
  <text x="715" y="323" font-size="22" font-weight="bold" fill="#111">AI-2: Product Studio <tspan font-size="16" font-weight="normal" fill="#444">(Real Product Development)</tspan></text>
  <text x="715" y="355" font-size="15" fill="#333">Advanced project course run like a small software team: standups, code</text>
  <text x="715" y="381" font-size="15" fill="#333">review, weekly demos. Students build systems the school really uses -</text>
  <text x="715" y="407" font-size="15" fill="#333">the TTMath website AI assistant, school management system, learning</text>
  <text x="715" y="433" font-size="15" fill="#333">tools, and carefully scoped internal prototypes.</text>

  <line x1="630" y1="463" x2="1330" y2="463" stroke="#eee"/>

  <rect x="630" y="500" width="64" height="64" rx="14" fill="#dcebfa"/>
  <polygon points="662,517 666,527.5 677.2,528.1 668.5,535.1 671.4,545.9 662,539.8 652.6,545.9 655.5,535.1 646.8,528.1 658,527.5" fill="#4a7fbe"/>
  <text x="715" y="528" font-size="22" font-weight="bold" fill="#111">AI-3: Algorithms <tspan font-size="16" font-weight="normal" fill="#444">(Machine Learning &amp; Deep Learning)</tspan></text>
  <text x="715" y="560" font-size="15" fill="#333">Algorithms course: how machine learning really works under the hood.</text>
  <text x="715" y="586" font-size="15" fill="#333">Fall builds classical ML from scratch; Winter covers PyTorch and deep</text>
  <text x="715" y="612" font-size="15" fill="#333">learning with contest practice; Summer is an optional bootcamp toward</text>
  <text x="715" y="638" font-size="15" fill="#333">IOAI (held each August) - every student leaves with a Kaggle portfolio.</text>
</svg>
