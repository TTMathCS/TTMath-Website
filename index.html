<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTMath Website Demos</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            padding: 24px;
        }
        .container { text-align: center; width: 100%; max-width: 900px; }
        h1 {
            margin: 0 0 32px;
            color: #333;
            font-size: clamp(1.5rem, 5vw, 2.2rem);
        }
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
        }
        .links a {
            flex: 1 1 220px;
            max-width: 320px;
            padding: 18px 24px;
            background: #2c3e50;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            line-height: 1.3;
        }
        .links a:hover, .links a:focus-visible { background: #3498db; }
        @media (max-width: 480px) {
            .links { flex-direction: column; }
            .links a { flex: none; max-width: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TTMath Website Demos</h1>
        <div class="links">
            <a href="demo1/">Demo 1</a>
            <a href="demo2/">Demo 2</a>
            <a href="demo3/">Demo 3</a>
            <a href="math-notes/">L3 Number Theory · Class 6</a>
            <a href="uoft_math/">U of T Math · Course Guides</a>
        </div>
    </div>
</body>
</html>
